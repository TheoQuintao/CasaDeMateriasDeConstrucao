<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Materiais do Théo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Nosso arquivo CSS personalizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 
        NAVBAR PRINCIPAL (igual ao site principal)
    -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-house-gear-fill"></i> Materiais do Théo
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Voltar ao Site</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="cadastro.html" class="btn btn-outline-light me-2">
                        <i class="bi bi-person-plus-fill"></i> Criar Conta
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 
        SEÇÃO DE LOGIN
    -->
    <section class="login-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-8">
                    <div class="login-card">
                        <div class="login-header">
                            <div class="login-logo">
                                <i class="bi bi-house-gear-fill"></i> Materiais do Théo
                            </div>
                            <h2>Acesse sua conta</h2>
                        </div>
                        <div class="login-body">
                            <form class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label for="email" class="form-label">E-mail</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                                    </div>
                                    <div class="invalid-feedback">
                                        Por favor, insira um e-mail válido.
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="senha" class="form-label">Senha</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                        <input type="password" class="form-control" id="senha" required>
                                    </div>
                                    <div class="invalid-feedback">
                                        Por favor, insira sua senha.
                                    </div>
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="lembrar">
                                    <label class="form-check-label" for="lembrar">Lembrar de mim</label>
                                    <a href="recuperar-senha.html" class="float-end">Esqueceu a senha?</a>
                                </div>
                                
                                <button type="submit" class="btn btn-primary btn-login mb-3">
                                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                                </button>
                                
                                <div class="text-center mt-3">
                                    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                                </div>
                                
                                <div class="divider my-4">ou entre com</div>
                                
                                <div class="d-grid gap-2">
                                    <button type="button" class="btn btn-outline-primary">
                                        <i class="bi bi-google"></i> Google
                                    </button>
                                    <button type="button" class="btn btn-outline-primary">
                                        <i class="bi bi-facebook"></i> Facebook
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Validação do formulário -->
    <script>
    (function () {
      'use strict'
    
      var forms = document.querySelectorAll('.needs-validation')
    
      Array.prototype.slice.call(forms)
        .forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }
    
            form.classList.add('was-validated')
          }, false)
        })
    })()
    </script>
</body>
</html>
